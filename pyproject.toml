[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-uninstaller"
version = "0.1.0"
description = "A Windows desktop tool for reviewing and uninstalling installed applications."
requires-python = ">=3.10"
dependencies = ["PySide6==6.11.1"]

[project.scripts]
bulk-uninstaller = "BulkUninstaller.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
